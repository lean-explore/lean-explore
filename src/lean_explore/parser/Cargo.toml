[workspace]
resolver = "2"
members = ["crates/lean-informal", "crates/lean-source", "crates/lean-source-cli", "crates/lean-source-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
lto = "fat"
codegen-units = 1
